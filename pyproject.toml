[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "football"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "moustafa elmehy" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.161.1",
    "kagglehub>=1.0.2",
    "matplotlib>=3.10.9",
    "mlflow>=3.17.2",
    "mlxtend>=0.23.4",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.14.1",
    "python-dotenv",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["football"]
force_sort_within_sections = true

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "isort>=9.0.2",
    "mkdocs>=1.6.1",
    "pytest>=9.1.1",
]


