services:
  mlflow:
    build: .
    image: xa-api
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --artifacts-destination /mlflow-data/artifacts
      --allowed-hosts "mlflow:5000,localhost:5000,127.0.0.1:5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow-data

  api:
    image: xa-api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      - mlflow
    restart: on-failure

volumes:
  mlflow-data: