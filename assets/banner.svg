<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07140f"/>
      <stop offset="0.55" stop-color="#0b2a1e"/>
      <stop offset="1" stop-color="#0a1f2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee59d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2ee59d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9f6d8"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="type">
      <rect x="80" y="150" height="40" width="0">
        <animate attributeName="width" values="0;480;480;0" keyTimes="0;0.35;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- slow moving glow -->
    <circle cx="900" cy="150" r="260" fill="url(#glow)">
      <animate attributeName="cx" values="820;980;820" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- pitch markings -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2">
      <rect x="20" y="20" width="1160" height="260" rx="6"/>
      <line x1="600" y1="20" x2="600" y2="280"/>
      <circle cx="600" cy="150" r="58"/>
      <rect x="1030" y="70" width="150" height="160"/>
      <rect x="1120" y="110" width="60" height="80"/>
      <path d="M1030 118 A 44 44 0 0 0 1030 182"/>
    </g>

    <!-- title -->
    <text x="80" y="122" font-size="66" font-weight="800" fill="url(#title)" letter-spacing="1">xA Expected</text>
    <g clip-path="url(#type)">
      <text x="82" y="180" font-size="24" fill="#7ee8b5">Expected assists · end-to-end MLOps</text>
    </g>
    <text x="82" y="228" font-size="15" fill="#ffffff" fill-opacity="0.55" letter-spacing="3">SCIKIT-LEARN · MLFLOW · FASTAPI · DOCKER</text>

    <!-- the pass -->
    <path id="pass" d="M680 236 Q 860 40 1062 140" fill="none" stroke="#2ee59d" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" stroke-opacity="0.75">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="0.9s" repeatCount="indefinite"/>
    </path>

    <!-- defenders -->
    <g fill="#ff6b6b" fill-opacity="0.85">
      <circle cx="905" cy="190" r="9">
        <animate attributeName="cy" values="190;200;190" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="975" cy="230" r="9">
        <animate attributeName="cx" values="975;960;975" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="96" r="9">
        <animate attributeName="cy" values="96;108;96" dur="2.7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- passer -->
    <circle cx="680" cy="236" r="12" fill="#ffffff"/>
    <text x="664" y="270" font-size="13" fill="#ffffff" fill-opacity="0.6">pass</text>

    <!-- receiver, pulses when the ball arrives -->
    <circle cx="1062" cy="140" r="12" fill="#ffffff"/>
    <circle cx="1062" cy="140" r="12" fill="none" stroke="#2ee59d" stroke-width="3">
      <animate attributeName="r" values="12;12;34" keyTimes="0;0.6;1" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0;1;0" keyTimes="0;0.6;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="1040" y="118" font-size="13" fill="#ffffff" fill-opacity="0.6">shot</text>

    <!-- ball -->
    <g>
      <circle r="8" fill="#ffffff" stroke="#0b2a1e" stroke-width="2"/>
      <circle r="3" fill="#0b2a1e"/>
      <animateMotion dur="2.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear">
        <mpath xlink:href="#pass" href="#pass"/>
      </animateMotion>
    </g>

    <!-- xA label pops in -->
    <g font-weight="700">
      <rect x="1080" y="166" width="88" height="34" rx="17" fill="#2ee59d"/>
      <text x="1124" y="189" font-size="16" fill="#07140f" text-anchor="middle">xA 0.42</text>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.66;0.95;1" dur="2.5s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
