# CI/CD pipeline: lint and test every change; later phases add the Docker image.
name: CI/CD

# When the workflow runs: pushes to main, pull requests targeting main,
# and manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch at a time: a new push cancels the older, still-running run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default token permissions: read-only access to the repository code.
permissions:
  contents: read

jobs:
  # Style checks: flake8 (errors), black (formatting), isort (import order).
  lint:
    runs-on: ubuntu-latest
    steps:
      # Download the repository code onto the runner.
      - uses: actions/checkout@v7

      # Install uv and cache downloaded packages between runs (keyed on uv.lock).
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Install the exact versions from uv.lock (fails if the lock is out of date).
      - name: Install dependencies
        run: uv sync --frozen --python 3.10

      - name: flake8
        run: uv run flake8 football tests

      - name: black
        run: uv run black --check football tests

      - name: isort
        run: uv run isort --check-only football tests

  # Unit tests. The API tests use a fake model, so no MLflow server or dataset is needed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.10

      - name: pytest
        run: uv run pytest -q

  # Build the API image and check it starts Python correctly; publish it on pushes to main.
  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow defaults, so contents: read is repeated.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Buildx is Docker's modern builder; needed for the GitHub Actions layer cache.
      - uses: docker/setup-buildx-action@v4

      # Build the image and load it into the runner's local Docker (no push yet).
      # Layers are cached in GitHub Actions, so unchanged layers are not rebuilt.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: xa-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: the full API cannot start here (it needs a @champion model in MLflow),
      # so only check that the code and its main dependencies import inside the image.
      - name: Smoke test
        run: docker run --rm xa-api:ci python -c "import football.api, uvicorn; print('image OK')"

      # Everything below runs only on a push to main, never on pull requests.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names on ghcr.io must be lowercase; tag with "latest" and the short commit sha.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          for TAG in latest "$SHORT_SHA"; do
            docker tag xa-api:ci "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
